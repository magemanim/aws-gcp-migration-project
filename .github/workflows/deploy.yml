name: GCP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/devops

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: alpha

    env:
      PROJECT_ID: aws-gcp-migration-project
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: sample-repo
      IMAGE: sample-app
      SERVICE: sample-cloudrun-service
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP Project
        run: |
          gcloud config set project $PROJECT_ID

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA .

      - name: Push Docker Image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA

      - name: Create Build Artifact
        run: |
          mkdir artifacts
          echo "Build completed successfully" > artifacts/build.txt

      - name: Upload Artifact to GCS
        run: |
          gsutil cp artifacts/build.txt gs://$GCS_BUCKET/

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated